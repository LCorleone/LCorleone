<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" fill="none" role="img" aria-label="Live GitHub telemetry for @LCorleone - public repos, total stars, followers, commits in the last 12 months, contributed repos, last push and a 12-month contribution pulse">
  <defs>
    <linearGradient id="statsBgLight" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="statsBorderLight" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="statsScanLight" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="statsPulseLight" x1="36" y1="0" x2="864" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="statsGlowCyanLight" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="statsGlowEmeraldLight" cx="82%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="statsGlowVioletLight" cx="54%" cy="14%" r="40%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <pattern id="statsGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="0.9" fill="#94A3B8" fill-opacity="0.7" />
    </pattern>
  </defs>
  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .pulse-dot {
      animation: statsPulseGlowLight 2.2s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: statsRingExpandLight 2.2s ease-out infinite;
    }
    .scan-beam {
      animation: statsScanSweepLight 6.5s ease-in-out infinite;
    }
    .led-1 { animation: statsBlinkLedLight 2.6s ease-in-out infinite 0s; }
    .led-2 { animation: statsBlinkLedLight 2.6s ease-in-out infinite 0.65s; }
    .led-3 { animation: statsBlinkLedLight 2.6s ease-in-out infinite 1.3s; }

    @keyframes statsPulseGlowLight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes statsRingExpandLight {
      0% { transform: scale(0.9); opacity: 0.85; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes statsScanSweepLight {
      0%, 100% { transform: translateY(0px); opacity: 0.22; }
      50% { transform: translateY(382px); opacity: 0.65; }
    }
    @keyframes statsBlinkLedLight {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
  <!-- Container: gradient + HUD grid + ambient glows -->
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsBgLight)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGridLight)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowCyanLight)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowEmeraldLight)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowVioletLight)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="none" stroke="url(#statsBorderLight)" stroke-width="1.6" />
  <!-- Animated horizontal scanline -->
  <rect class="scan-beam" x="12" y="18" width="876" height="1.5" fill="url(#statsScanLight)" />
