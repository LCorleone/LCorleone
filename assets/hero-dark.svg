  <circle cx="306" cy="257" r="3" fill="#F97316" />
  <text x="315" y="261" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">Rust</text>

  <!-- Pill: C++ -->
  <rect x="364" y="244" width="60" height="26" rx="6" fill="#0F172A" stroke="#A855F7" stroke-width="1" stroke-opacity="0.7" />
  <circle cx="378" cy="257" r="3" fill="#A855F7" />
  <text x="387" y="261" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">C++</text>

  <!-- Pill: C# -->
  <rect x="432" y="244" width="54" height="26" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1" stroke-opacity="0.7" />
  <circle cx="446" cy="257" r="3" fill="#10B981" />
  <text x="455" y="261" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">C#</text>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: LIVE ACTIVE TELEMETRY // 2026 MATRIX CARD   -->
  <!-- ========================================================= -->

  <!-- Terminal Outer Container -->
  <rect x="578" y="26" width="590" height="268" rx="10" fill="#090D16" fill-opacity="0.9" stroke="#334155" stroke-width="1.2" />

  <!-- Terminal Header Bar -->
  <rect x="578" y="26" width="590" height="36" rx="10" fill="#0F172A" />
  <line x1="578" y1="62" x2="1168" y2="62" stroke="#1E293B" stroke-width="1.2" />

  <!-- Terminal Window Dots -->
  <circle cx="598" cy="44" r="4.5" fill="#EF4444" fill-opacity="0.85" />
  <circle cx="613" cy="44" r="4.5" fill="#F59E0B" fill-opacity="0.85" />
  <circle cx="628" cy="44" r="4.5" fill="#10B981" fill-opacity="0.85" />

  <!-- Terminal Title -->
  <text x="646" y="48" class="mono" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.1">ACTIVE TELEMETRY // 2026 ENGINEERING MATRIX</text>

  <!-- Live Sync Badge -->
  <rect x="1084" y="34" width="70" height="20" rx="4" fill="#090D16" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.6" />
  <circle class="pulse-dot" cx="1096" cy="44" r="3" fill="#10B981" />
  <text x="1105" y="48" class="mono" font-size="9.5" font-weight="700" fill="#10B981">ONLINE</text>

  <!-- Subsystem Row [01]: AGENT HARNESS -->
  <rect x="592" y="72" width="562" height="46" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <rect x="592" y="72" width="4" height="46" rx="2" fill="#38BDF8" />
  <rect x="606" y="83" width="148" height="24" rx="4" fill="#090D16" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.5" />
