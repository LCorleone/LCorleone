  <text x="766" y="99" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">pi-desktop (★26) · pi-wx-agent · pi-subagents · pi-tau</text>
  <circle class="row-led-1" cx="1138" cy="95" r="3.5" fill="#38BDF8" />

  <!-- Subsystem Row [02]: LLM GATEWAYS -->
  <rect x="592" y="126" width="562" height="46" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <rect x="592" y="126" width="4" height="46" rx="2" fill="#10B981" />
  <rect x="606" y="137" width="148" height="24" rx="4" fill="#090D16" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.5" />
  <text x="615" y="153" class="mono" font-size="10.5" font-weight="700" fill="#10B981">[02] LLM GATEWAYS</text>
  <text x="766" y="153" class="mono" font-size="11" font-weight="600" fill="#E2E8F0">one-api (Idempotent Billing) · magpie (Agent Proxy)</text>
  <circle class="row-led-2" cx="1138" cy="149" r="3.5" fill="#10B981" />

  <!-- Subsystem Row [03]: WEARABLE & BIO -->
  <rect x="592" y="180" width="562" height="46" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <rect x="592" y="180" width="4" height="46" rx="2" fill="#F59E0B" />
  <rect x="606" y="191" width="148" height="24" rx="4" fill="#090D16" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.5" />
