<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="July Lu (@LCorleone) - AI Agent Architect, LLM Gateway Engineer, Native &amp; Wearable Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="55%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="44" y1="70" x2="320" y2="125" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="creedGrad" x1="44" y1="174" x2="530" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="scanlineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="82%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <pattern id="hudGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
      <circle cx="32" cy="32" r="0.9" fill="#334155" fill-opacity="0.65" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .pulse-dot {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: ringExpand 2.2s ease-out infinite;
    }
    .circuit-flow {
      stroke-dasharray: 8 10;
      animation: dashFlow 3.5s linear infinite;
    }
    .circuit-flow-rev {
      stroke-dasharray: 6 12;
      animation: dashFlowRev 4.2s linear infinite;
    }
    .scan-beam {
      animation: scanSweep 7s ease-in-out infinite;
    }
    .row-led-1 { animation: blinkLed 2.4s ease-in-out infinite 0.0s; }
    .row-led-2 { animation: blinkLed 2.4s ease-in-out infinite 0.5s; }
    .row-led-3 { animation: blinkLed 2.4s ease-in-out infinite 1.0s; }
    .row-led-4 { animation: blinkLed 2.4s ease-in-out infinite 1.5s; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    @keyframes ringExpand {
      0% { transform: scale(0.9); opacity: 0.85; }
      100% { transform: scale(2.3); opacity: 0; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -72; }
    }
    @keyframes dashFlowRev {
      to { stroke-dashoffset: 72; }
    }
    @keyframes scanSweep {
      0%, 100% { transform: translateY(0px); opacity: 0.25; }
      50% { transform: translateY(276px); opacity: 0.65; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Main Background & Grid -->
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="url(#bgGrad)" />
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="url(#hudGrid)" />
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="url(#cyanGlow)" />
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="url(#emeraldGlow)" />
  <rect x="4" y="4" width="1192" height="312" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Subtle Horizontal Scanline -->
  <rect class="scan-beam" x="12" y="18" width="1176" height="1.5" fill="url(#scanlineGrad)" />

  <!-- HUD Corner Brackets -->
  <path d="M 16 34 L 16 16 L 36 16" stroke="#38BDF8" stroke-width="2" stroke-linecap="square" />
  <path d="M 1164 16 L 1184 16 L 1184 34" stroke="#10B981" stroke-width="2" stroke-linecap="square" />
  <path d="M 16 286 L 16 304 L 36 304" stroke="#38BDF8" stroke-width="2" stroke-linecap="square" />
  <path d="M 1164 304 L 1184 304 L 1184 286" stroke="#10B981" stroke-width="2" stroke-linecap="square" />

  <!-- Circuit Connectors Between Identity Core & Telemetry Card -->
  <path d="M 526 100 L 552 100 L 564 100 L 578 100" stroke="#1E293B" stroke-width="1.5" fill="none" />
  <path class="circuit-flow" d="M 526 100 L 578 100" stroke="#38BDF8" stroke-width="1.5" fill="none" />
  <circle cx="526" cy="100" r="2.5" fill="#38BDF8" />

  <path d="M 528 195 L 554 195 L 564 152 L 578 152" stroke="#1E293B" stroke-width="1.5" fill="none" />
  <path class="circuit-flow-rev" d="M 528 195 L 554 195 L 564 152 L 578 152" stroke="#10B981" stroke-width="1.5" fill="none" />
  <circle cx="528" cy="195" r="2.5" fill="#10B981" />

  <path d="M 510 256 L 552 256 L 564 204 L 578 204" stroke="#1E293B" stroke-width="1.5" fill="none" />
  <path class="circuit-flow" d="M 510 256 L 552 256 L 564 204 L 578 204" stroke="#F59E0B" stroke-width="1.5" fill="none" />
  <circle cx="510" cy="256" r="2.5" fill="#F59E0B" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: IDENTITY, ARCHITECTURAL ROLE, CREED & STACK  -->
  <!-- ========================================================= -->

  <!-- Top Tag Pill: SYSTEM.IDENTITY // LCORLEONE -->
  <rect x="42" y="30" width="286" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.55" />
  <circle class="pulse-ring" cx="59" cy="43" r="4.5" fill="none" stroke="#10B981" stroke-width="1.4" />
  <circle class="pulse-dot" cx="59" cy="43" r="4" fill="#10B981" />
  <text x="72" y="47" class="mono" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1.3">SYSTEM.IDENTITY // LCORLEONE</text>

  <!-- Node Metadata Tag -->
  <rect x="338" y="30" width="164" height="26" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="350" y="47" class="mono" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">BUILD // 2026.10.RPC</text>

  <!-- Main Display Title: JULY LU -->
  <text x="42" y="114" class="mono" font-size="52" font-weight="800" fill="url(#titleGrad)" letter-spacing="3">JULY LU</text>
  <rect x="312" y="84" width="128" height="24" rx="5" fill="#1E293B" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.45" />
  <text x="324" y="100" class="mono" font-size="12" font-weight="600" fill="#38BDF8">@LCorleone</text>
  <text x="314" y="122" class="mono" font-size="10" font-weight="500" fill="#64748B" letter-spacing="1">SYSTEMS &amp; AI ENGINEER</text>

  <!-- Subtitle -->
  <text x="42" y="150" class="sans" font-size="14" font-weight="600" fill="#E2E8F0" letter-spacing="0.2">
    AI Agent Architect <tspan fill="#38BDF8">·</tspan> LLM Gateway Engineer <tspan fill="#10B981">·</tspan> Native &amp; Wearable Systems
  </text>

  <!-- Signature Creed Box: "NO VICTORY NO SURVIVE" -->
  <rect x="42" y="172" width="486" height="44" rx="8" fill="url(#creedGrad)" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.7" />
  <rect x="42" y="172" width="5" height="44" rx="2" fill="#38BDF8" />
  <rect x="54" y="182" width="76" height="24" rx="4" fill="#090D16" stroke="#334155" stroke-width="0.8" />
  <text x="64" y="198" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="1">CREED //</text>
  <text x="144" y="199" class="mono" font-size="15" font-weight="800" fill="#F8FAFC" letter-spacing="2.2">"NO VICTORY NO SURVIVE"</text>
  <circle class="pulse-dot" cx="508" cy="194" r="3.5" fill="#F59E0B" />

  <!-- Stack Pills Row -->
  <text x="42" y="236" class="mono" font-size="9.5" font-weight="700" fill="#64748B" letter-spacing="1.4">CORE RUNTIME &amp; SYSTEMS STACK</text>

  <!-- Pill: TypeScript -->
  <rect x="42" y="244" width="96" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.7" />
  <circle cx="56" cy="257" r="3" fill="#38BDF8" />
  <text x="65" y="261" class="mono" font-size="11" font-weight="700" fill="#E2E8F0">TypeScript</text>

  <!-- Pill: Go -->
  <rect x="146" y="244" width="54" height="26" rx="6" fill="#0F172A" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.7" />
