  <!-- Subsystem Row [04]: NATIVE & LAB -->
  <rect x="592" y="234" width="562" height="46" rx="7" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
  <rect x="592" y="234" width="4" height="46" rx="2" fill="#A855F7" />
  <rect x="606" y="245" width="148" height="24" rx="4" fill="#090D16" stroke="#A855F7" stroke-width="0.8" stroke-opacity="0.5" />
