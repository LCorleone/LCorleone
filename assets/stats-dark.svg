<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" fill="none" role="img" aria-label="Live GitHub telemetry for @LCorleone - public repos, total stars, followers, commits in the last 12 months, contributed repos, last push and a 12-month contribution pulse">
  <defs>
    <linearGradient id="statsBgDark" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="statsBorderDark" x1="0" y1="0" x2="900" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="statsScanDark" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="statsPulseDark" x1="36" y1="0" x2="864" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <radialGradient id="statsGlowCyanDark" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="statsGlowEmeraldDark" cx="82%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="statsGlowVioletDark" cx="54%" cy="14%" r="40%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
    <pattern id="statsGridDark" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
      <circle cx="30" cy="30" r="0.9" fill="#334155" fill-opacity="0.7" />
    </pattern>
  </defs>
  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .pulse-dot {
      animation: statsPulseGlowDark 2.2s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: statsRingExpandDark 2.2s ease-out infinite;
    }
    .scan-beam {
      animation: statsScanSweepDark 6.5s ease-in-out infinite;
    }
    .led-1 { animation: statsBlinkLedDark 2.6s ease-in-out infinite 0s; }
    .led-2 { animation: statsBlinkLedDark 2.6s ease-in-out infinite 0.65s; }
    .led-3 { animation: statsBlinkLedDark 2.6s ease-in-out infinite 1.3s; }

    @keyframes statsPulseGlowDark {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes statsRingExpandDark {
      0% { transform: scale(0.9); opacity: 0.85; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes statsScanSweepDark {
      0%, 100% { transform: translateY(0px); opacity: 0.22; }
      50% { transform: translateY(382px); opacity: 0.65; }
    }
    @keyframes statsBlinkLedDark {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
  <!-- Container: gradient + HUD grid + ambient glows -->
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsBgDark)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGridDark)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowCyanDark)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowEmeraldDark)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="url(#statsGlowVioletDark)" />
  <rect x="4" y="4" width="892" height="412" rx="14" fill="none" stroke="url(#statsBorderDark)" stroke-width="1.6" />
  <!-- Animated horizontal scanline -->
  <rect class="scan-beam" x="12" y="18" width="876" height="1.5" fill="url(#statsScanDark)" />
