  <rect x="36" y="176" width="3.5" height="94" rx="1.75" fill="#38BDF8" />
  <circle class="led-1" cx="282" cy="193" r="3" fill="#38BDF8" />
  <text x="52" y="201" class="mono" font-size="11" font-weight="700" fill="#64748B" letter-spacing="1.2">COMMITS / 12M</text>
  <text x="52" y="238" class="sans" font-size="30" font-weight="700" fill="#38BDF8">2,347</text>
  <text x="52" y="260" class="mono" font-size="10.5" fill="#64748B">DEC 2025 – NOV 2026</text>
  <rect x="318" y="176" width="264" height="94" rx="10" fill="#0B1120" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.55" />
