  <defs>
    <linearGradient id="archBgLight" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="archBorderLight" x1="0" y1="0" x2="900" y2="520" gradientUnits="userSpaceOnUse">
