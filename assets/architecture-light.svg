    }
    .flow-fwd {
      stroke-dasharray: 6 8;
      animation: flowRight 2.6s linear infinite;
    }
    .flow-bus {
      stroke-dasharray: 10 12;
      animation: flowLeft 4.5s linear infinite;
    }
    .node-pulse {
      animation: nodeBlink 2.8s ease-in-out infinite;
    }
    @keyframes flowRight {
      to { stroke-dashoffset: -56; }
    }
    @keyframes flowLeft {
      to { stroke-dashoffset: 88; }
    }
    @keyframes nodeBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

