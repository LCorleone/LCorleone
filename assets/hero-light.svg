<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" fill="none" role="img" aria-label="July Lu (@LCorleone) - AI &amp; Systems Architect: Agent Harnesses, LLM Gateways, Wearable Telemetry">
  <defs>
    <linearGradient id="bgGradLight" x1="0" y1="0" x2="900" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="borderGradLight" x1="0" y1="0" x2="900" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.7" />
    </linearGradient>
    <linearGradient id="titleGradLight" x1="36" y1="68" x2="310" y2="124" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="mottoGradLight" x1="36" y1="180" x2="486" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="scanlineGradLight" x1="0" y1="0" x2="900" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="cobaltGlow" cx="22%" cy="32%" r="48%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlowLight" cx="80%" cy="62%" r="46%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="violetGlowLight" cx="55%" cy="18%" r="36%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
    <pattern id="hudGridLight" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#E2E8F0" stroke-width="0.8" />
      <circle cx="30" cy="30" r="0.9" fill="#94A3B8" fill-opacity="0.55" />
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .sans {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .pulse-dot {
      animation: pulseGlow 2.2s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: center;
      transform-box: fill-box;
      animation: ringExpand 2.2s ease-out infinite;
    }
    .circuit-flow {
      stroke-dasharray: 6 8;
      animation: dashFlow 3s linear infinite;
    }
    .circuit-flow-rev {
      stroke-dasharray: 5 9;
      animation: dashFlowRev 3.6s linear infinite;
    }
    .scan-beam {
      animation: scanSweep 6.5s ease-in-out infinite;
    }
    .row-led-1 { animation: blinkLed 2.4s ease-in-out infinite 0.0s; }
    .row-led-2 { animation: blinkLed 2.4s ease-in-out infinite 0.6s; }
    .row-led-3 { animation: blinkLed 2.4s ease-in-out infinite 1.2s; }
    .row-led-4 { animation: blinkLed 2.4s ease-in-out infinite 1.8s; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes ringExpand {
      0% { transform: scale(0.9); opacity: 0.8; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -56; }
    }
    @keyframes dashFlowRev {
      to { stroke-dashoffset: 56; }
    }
    @keyframes scanSweep {
      0%, 100% { transform: translateY(0px); opacity: 0.2; }
      50% { transform: translateY(268px); opacity: 0.55; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>

  <!-- Main Background, Blueprint Grid & Ambient Glows -->
  <rect x="4" y="4" width="892" height="302" rx="14" fill="url(#bgGradLight)" />
  <rect x="4" y="4" width="892" height="302" rx="14" fill="url(#hudGridLight)" />
  <rect x="4" y="4" width="892" height="302" rx="14" fill="url(#cobaltGlow)" />
  <rect x="4" y="4" width="892" height="302" rx="14" fill="url(#emeraldGlowLight)" />
  <rect x="4" y="4" width="892" height="302" rx="14" fill="url(#violetGlowLight)" />

  <!-- Subtle Perspective Deck Lines -->
  <path d="M 4 250 L 896 250" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.6" />
  <path d="M 4 282 L 896 282" stroke="#CBD5E1" stroke-width="0.7" stroke-opacity="0.6" />
  <rect x="4" y="4" width="892" height="302" rx="14" fill="none" stroke="url(#borderGradLight)" stroke-width="1.6" />

  <!-- Animated Horizontal Scanline -->
  <rect class="scan-beam" x="12" y="18" width="876" height="1.5" fill="url(#scanlineGradLight)" />

  <!-- Glowing Corner HUD Brackets -->
  <path d="M 16 34 L 16 16 L 34 16" stroke="#0284C7" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 866 16 L 884 16 L 884 34" stroke="#059669" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 16 276 L 16 294 L 34 294" stroke="#0284C7" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 866 294 L 884 294 L 884 276" stroke="#059669" stroke-width="2.2" stroke-linecap="square" />

  <!-- Circuit Data-Flow Links Between Left Identity Deck & Right HUD Console -->
  <path d="M 480 95 L 510 95" stroke="#CBD5E1" stroke-width="1.5" />
  <path class="circuit-flow" d="M 480 95 L 510 95" stroke="#0284C7" stroke-width="1.8" />
  <circle cx="480" cy="95" r="2.5" fill="#0284C7" />

  <path d="M 480 200 L 510 200" stroke="#CBD5E1" stroke-width="1.5" />
  <path class="circuit-flow-rev" d="M 480 200 L 510 200" stroke="#059669" stroke-width="1.8" />
  <circle cx="480" cy="200" r="2.5" fill="#059669" />

  <!-- ========================================================= -->
  <!-- LEFT COLUMN (x=36..490): IDENTITY, ROLE, MOTTO & STACK    -->
  <!-- ========================================================= -->

  <!-- Status Badge Pill (height="28") -->
  <rect x="36" y="28" width="320" height="28" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.3" stroke-opacity="0.75" />
  <circle class="pulse-ring" cx="54" cy="42" r="4.5" fill="none" stroke="#059669" stroke-width="1.5" />
  <circle class="pulse-dot" cx="54" cy="42" r="4" fill="#059669" />
  <text x="68" y="46.5" class="mono" font-size="12.5" font-weight="700" fill="#0284C7" letter-spacing="0.6">LCORLEONE // AI &amp; SYSTEMS ARCHITECT</text>

  <!-- Hero Name: JULY LU (52px extra-bold) + Handle Badge -->
  <text x="36" y="116" class="mono" font-size="52" font-weight="800" fill="url(#titleGradLight)" letter-spacing="2.5">JULY LU</text>
  <rect x="288" y="84" width="104" height="26" rx="6" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.1" stroke-opacity="0.6" />
  <text x="300" y="101.5" class="mono" font-size="13" font-weight="700" fill="#0284C7">@LCorleone</text>

  <!-- Role Line (16px medium sans-serif) -->
  <text x="36" y="156" class="sans" font-size="16" font-weight="600" fill="#0F172A" letter-spacing="0.1">
    Agent Harnesses <tspan fill="#0284C7" font-weight="800">·</tspan> LLM Gateways <tspan fill="#059669" font-weight="800">·</tspan> Wearable Telemetry
  </text>

  <!-- Signature Motto Box (height="40") -->
  <rect x="36" y="180" width="444" height="40" rx="8" fill="url(#mottoGradLight)" stroke="#0284C7" stroke-width="1.3" />
  <rect x="36" y="180" width="5" height="40" rx="2" fill="#0284C7" />
  <rect x="50" y="188" width="76" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.9" stroke-opacity="0.7" />
  <text x="58" y="204.5" class="mono" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="0.5">CREED //</text>
  <text x="138" y="205" class="mono" font-size="15" font-weight="800" fill="#FFFFFF" letter-spacing="2">"NO VICTORY NO SURVIVE"</text>
  <circle class="pulse-dot" cx="462" cy="200" r="3.5" fill="#38BDF8" />

  <!-- Tech Stack Pills (height="26" each, 13px bold monospace) -->
  <!-- TypeScript -->
  <rect x="36" y="248" width="112" height="26" rx="6" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2" />
  <circle cx="49" cy="261" r="3.5" fill="#0284C7" />
  <text x="59" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">TypeScript</text>

  <!-- Go -->
  <rect x="155" y="248" width="52" height="26" rx="6" fill="#FFFFFF" stroke="#0891B2" stroke-width="1.2" />
  <circle cx="168" cy="261" r="3.5" fill="#0891B2" />
  <text x="178" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">Go</text>

  <!-- Python -->
  <rect x="214" y="248" width="80" height="26" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" />
  <circle cx="227" cy="261" r="3.5" fill="#D97706" />
  <text x="237" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">Python</text>

  <!-- Rust -->
  <rect x="301" y="248" width="66" height="26" rx="6" fill="#FFFFFF" stroke="#EA580C" stroke-width="1.2" />
  <circle cx="314" cy="261" r="3.5" fill="#EA580C" />
  <text x="324" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">Rust</text>

  <!-- C++ -->
  <rect x="374" y="248" width="58" height="26" rx="6" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.2" />
  <circle cx="387" cy="261" r="3.5" fill="#7C3AED" />
  <text x="397" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">C++</text>

  <!-- C# -->
  <rect x="439" y="248" width="51" height="26" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" />
  <circle cx="452" cy="261" r="3.5" fill="#059669" />
  <text x="462" y="265.5" class="mono" font-size="13" font-weight="700" fill="#0F172A">C#</text>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN (x=510..864): 2026.09-10 ACTIVE FOCUS HUD    -->
  <!-- ========================================================= -->

  <!-- Clean HUD Card (width="354" height="254") -->
  <rect x="510" y="28" width="354" height="254" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="510" y="28" width="354" height="36" rx="12" fill="#F1F5F9" />
  <line x1="510" y1="64" x2="864" y2="64" stroke="#CBD5E1" stroke-width="1.2" />

  <!-- Console Header Dots & Title (13px bold) -->
  <circle cx="528" cy="46" r="4" fill="#EF4444" />
  <circle cx="541" cy="46" r="4" fill="#F59E0B" />
  <circle cx="554" cy="46" r="4" fill="#10B981" />
  <text x="568" y="50.5" class="mono" font-size="13" font-weight="700" fill="#0F172A" letter-spacing="0.6">LIVE TELEMETRY // 2026.09–10</text>
  <circle class="pulse-dot" cx="844" cy="46" r="4" fill="#059669" />

  <!-- Row 01: AGENT HARNESS (height="46") -->
  <rect x="522" y="72" width="330" height="46" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="522" y="72" width="4" height="46" rx="2" fill="#0284C7" />
  <text x="536" y="90.5" class="mono" font-size="14.5" font-weight="700" fill="#0284C7">01 · AGENT HARNESS</text>
  <circle class="row-led-1" cx="836" cy="86" r="3.5" fill="#0284C7" />
  <text x="536" y="109.5" class="sans" font-size="13" font-weight="600" fill="#0F172A">pi-desktop ★26 · pi-wx-agent · pi-subagents</text>

  <!-- Row 02: LLM GATEWAYS (height="46") -->
  <rect x="522" y="124" width="330" height="46" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="522" y="124" width="4" height="46" rx="2" fill="#059669" />
  <text x="536" y="142.5" class="mono" font-size="14.5" font-weight="700" fill="#059669">02 · LLM GATEWAYS</text>
  <circle class="row-led-2" cx="836" cy="138" r="3.5" fill="#059669" />
  <text x="536" y="161.5" class="sans" font-size="13" font-weight="600" fill="#0F172A">one-api · magpie</text>

  <!-- Row 03: WEARABLE BIO (height="46") -->
  <rect x="522" y="176" width="330" height="46" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="522" y="176" width="4" height="46" rx="2" fill="#D97706" />
  <text x="536" y="194.5" class="mono" font-size="14.5" font-weight="700" fill="#B45309">03 · WEARABLE BIO</text>
  <circle class="row-led-3" cx="836" cy="190" r="3.5" fill="#D97706" />
  <text x="536" y="213.5" class="sans" font-size="13" font-weight="600" fill="#0F172A">garmin-miniapp (Go mygo + HRV/ACWR)</text>

  <!-- Row 04: NATIVE & LAB (height="46") -->
  <rect x="522" y="228" width="330" height="46" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
  <rect x="522" y="228" width="4" height="46" rx="2" fill="#7C3AED" />
  <text x="536" y="246.5" class="mono" font-size="14.5" font-weight="700" fill="#7C3AED">04 · NATIVE &amp; LAB</text>
  <circle class="row-led-4" cx="836" cy="242" r="3.5" fill="#7C3AED" />
  <text x="536" y="265.5" class="sans" font-size="13" font-weight="600" fill="#0F172A">screenshot-dai (Rust) · poker (GTO+LLM)</text>
</svg>
