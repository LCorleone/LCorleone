name: Update Stats Card

on:
  schedule:
    - cron: "17 4 * * *" # daily at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render stats SVGs
        env:
          # A PAT in ACCESS_TOKEN (read:user) is preferred so GraphQL keeps working
          # even if the installation token is restricted; falls back to GITHUB_TOKEN.
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_stats.py

      - name: Commit refreshed cards
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/stats-dark.svg assets/stats-light.svg; then
            echo "Stats cards already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-dark.svg assets/stats-light.svg
          git commit -m "chore(stats): refresh GitHub telemetry cards [skip ci]"
          git push
